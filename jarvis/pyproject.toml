[project]
name = "jarvis"
version = "0.1.0"
description = "Local voice assistant for Apple Silicon (Ollama + Qwen3 + whisper.cpp + Piper + openWakeWord)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Installed on the Mac for the voice phases (2+). Kept optional so Phases 0-1
# (text brain + tools) run with a minimal dependency set.
voice = [
    "sounddevice>=0.4",
    "numpy>=1.24",
    "pywhispercpp>=1.2",
    "piper-tts>=1.2",
    "openwakeword>=0.6",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis*"]
